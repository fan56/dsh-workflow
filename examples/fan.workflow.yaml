format: dsh-workflow
version: 1

name: fan
description: M3 smoke — structured seed plus bounded foreach fan-out.

steps:
  - id: seed
    executor:
      agent: workhorse
    prompt: |
      Reply with ONLY this JSON and nothing else: {"items": ["alpha", "beta", "gamma"]}
    output:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: string

  - id: adapt
    needs: [seed]
    foreach:
      over: steps.seed.output.items
      as: item
      max-concurrency: 2
      step:
        executor:
          agent: workhorse
        prompt: |
          Item to acknowledge: {{item}}
          Reply with exactly: ACK-{{item}}
        on-error: continue
